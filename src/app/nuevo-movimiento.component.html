<div class="card shadow-sm">
  <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
    <span class="fw-bold">NuevoMovimientoComponent</span>
    <span class="badge bg-light text-primary">HIJO</span>
  </div>

  <div class="card-body">
    <div class="mb-3">
      <label for="tipo" class="form-label">Tipo de movimiento</label>
      <select id="tipo" class="form-select" [value]="tipo" (change)="cambiarTipo($event)">
        <option value="Recarga">Recarga</option>
        <option value="Gasto">Gasto</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="monto" class="form-label">Monto (S/)</label>
      <input
        id="monto"
        type="number"
        class="form-control"
        placeholder="0.00"
        step="0.01"
        min="0"
        [value]="monto"
        (input)="cambiarMonto($event)"
      />
      @if (monto === '') {
        <div class="form-text">Ingresa un monto mayor que cero.</div>
      }
    </div>

    @if (error) {
      <div class="alert alert-danger py-2" role="alert">{{ error }}</div>
    }

    <!-- Property binding: el botón se deshabilita si el formulario es inválido -->
    <button
      type="button"
      class="btn btn-primary w-100"
      [disabled]="!formularioValido"
      (click)="registrar()"
    >
      Registrar movimiento
    </button>

    @if (!formularioValido) {
      <div class="form-text mt-2">Botón deshabilitado: no se emite un movimiento inválido.</div>
    }
  </div>
</div>
